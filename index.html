<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>盤點小幫手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--mute:#7a756c;--line:#e6e1d6;--acc:#2f6f5e;--acc2:#e8f1ee;--warn:#b5532f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding-bottom:110px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:19px;margin:0}
.ttl .sub{font-size:12px;color:var(--mute);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:disabled{background:var(--acc2);border-color:var(--acc2);color:var(--acc)}
.btn.dng{color:var(--warn);border-color:#ebc9bb}
.stats{display:flex;gap:10px;margin-top:12px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--mute)}
.manual[hidden]{display:none}
.manual{display:flex;gap:8px;padding:12px 16px 4px}
.manual input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.list{padding:8px 16px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.item.hl{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.bc{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:16px;overflow-wrap:anywhere;cursor:pointer}
.bc small{display:block;font-family:inherit;font-size:11px;color:var(--mute);margin-top:2px}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer;touch-action:manipulation}
.ctl input{width:64px;height:40px;text-align:center;border:1px solid var(--line);border-radius:10px;font-size:18px;font-weight:600;background:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 10px;font-size:14px;line-height:1.7}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.fab .in{max-width:608px;margin:0 auto;display:flex;gap:8px}
.fab .btn{padding:16px;font-size:16px}
.fab .big{flex:1;font-size:18px;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(20,18,15,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px}
.sheet h2{font-size:17px;margin:0 0 6px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;text-align:center;margin:8px 0 4px;overflow-wrap:anywhere}
.tag{text-align:center;font-size:13px;color:var(--acc);margin-bottom:12px}
.qty{display:flex;justify-content:center;align-items:center;gap:10px}
.qty button{width:60px;height:60px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:26px;cursor:pointer}
.qty input{width:120px;height:60px;text-align:center;border:1px solid var(--line);border-radius:12px;font-size:28px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1;padding:13px}
.menu .btn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px 14px}
.menu .btn small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.hint{font-size:13px;color:var(--mute);line-height:1.6}
.f input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:6px 0 4px}
textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.sc{margin:12px 16px 4px;border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--card);cursor:pointer}
.sc.on{border-style:solid;border-color:var(--acc);background:var(--acc2)}
.sc.flash{animation:fl .35s}
@keyframes fl{0%{background:#cfe6dd}100%{background:var(--acc2)}}
.sc b{display:block;font-size:16px}
.sc span{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.sc .lastc{font-family:ui-monospace,Menlo,monospace;font-size:20px;color:var(--acc);margin-top:6px;min-height:26px}
#si{position:absolute;opacity:0;width:1px;height:1px;left:-9999px}
.btn.tg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.locbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:12px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;cursor:pointer;text-align:left}
.locbar .lb{font-size:12px;opacity:.7}
.locbar b{flex:1;font-size:20px}
.locbar.none{background:var(--card);color:var(--warn);border-color:var(--warn)}
.locbar .ch{font-size:13px;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 10px}
.locbar.none .ch{border-color:var(--warn)}
.locs .btn{display:flex;align-items:center;width:100%;margin-bottom:8px;padding:12px 14px;text-align:left}
.locs .btn b{flex:1;font-size:16px}
.locs .btn span{font-size:12px;color:var(--mute)}
.locs .btn.cur{border-color:var(--acc);background:var(--acc2)}
.addloc{display:flex;gap:8px;margin:6px 0 14px}
.addloc input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast{white-space:pre-line}

.camv{position:fixed;inset:0;background:#000;z-index:30;display:none}
.camv.show{display:block}
.camv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.win{width:86%;max-width:520px;aspect-ratio:2.2/1;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.9);position:relative;overflow:hidden}
.win i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#ff5a3c;box-shadow:0 0 8px #ff5a3c}
.win.hit{animation:hit .45s}
@keyframes hit{0%{border-color:#4ade80;box-shadow:0 0 0 9999px rgba(20,90,50,.55)}100%{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.45)}}
.camtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;color:#fff;font-size:15px}
.camtop span{flex:1;text-align:center;font-weight:600}
.cbtn{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:9px 14px;font-size:15px}
.cbtn.on{background:#fff;color:#000}
.campanel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 16px);background:rgba(255,255,255,.96);border-radius:16px;padding:14px;text-align:center;max-width:560px;margin:0 auto}
.cphint{font-size:15px;color:var(--mute);padding:8px 0}
.cpcode{font-family:ui-monospace,Menlo,monospace;font-size:22px;overflow-wrap:anywhere}
.cpq{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 4px}
.cpq button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:24px}
.cpq input{width:120px;height:56px;text-align:center;font-size:30px;font-weight:700;border:2px solid var(--acc);border-radius:12px;background:#fff;color:var(--ink);padding:0}
.cpq input:focus{outline:none;box-shadow:0 0 0 3px var(--acc2)}
.cpsub{font-size:12px;color:var(--acc)}
.cpname{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px;overflow-wrap:anywhere;min-height:1em}
.bc .nm{display:block;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:13px;color:var(--ink);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .lname{font-size:14px;color:var(--ink);margin-top:2px;min-height:18px}
.undo{display:flex;align-items:center;gap:8px;margin:10px 16px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--mute)}
.undo[hidden]{display:none}
.undo span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
.undo button{border:1px solid var(--warn);color:var(--warn);background:#fff;border-radius:8px;padding:6px 14px;font-size:14px}
.locs .lrow{display:flex;gap:6px}
.locs .lrow .btn[data-l]{flex:1}
.locs .lrow .ed{width:auto;flex:none;font-size:13px}
.wbox{margin-top:10px;background:#fff6e5;border:1px solid #f0c36d;color:#6b4b00;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.wbox b{display:block;font-size:14px}
.wbox.red{background:#fde8e4;border-color:#e59a8a;color:#8a2a17}
.wbox button{display:block;margin-top:6px;border:none;border-radius:8px;padding:7px 12px;background:#b5532f;color:#fff;font-size:14px}
.crow{display:flex;gap:8px;margin-top:10px}
.cundo{flex:none;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px}
.cundo[hidden]{display:none}
.cnext{flex:1;display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:18px;font-weight:600}
.cnext[hidden]{display:none}
.win.paused{border-color:rgba(255,255,255,.35)}
.win.paused i{display:none}
</style></head><body><div id="app"></div><script>
(function(){
const $=s=>document.querySelector(s);
const KEY='inv-standalone-v1';
let S={loc:'',locs:[],items:[]};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))S=d}catch(e){}
S.loc=S.loc||'';S.locs=S.locs||[];S.hist=S.hist||[];S.names=S.names||{};S.items.forEach(x=>{if(x.loc==null)x.loc=''});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let last=null,scanning=false,gun=false,gunT=null,actx=null;
const desk=(()=>{try{return matchMedia('(pointer:fine)').matches&&!matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
let kb='',kbT=null,kbLast=0;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.round(n*1000)/1000;
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const LN=l=>l||'未指定';
const isBook2=c=>/^19[12]\d{10}$/.test(c);
const okCode=c=>/^\d{6,14}$/.test(c)&&!isBook2(c);
const mode='single';
const find=c=>S.items.find(x=>x.code===c&&x.loc===S.loc);
const here=()=>S.items.filter(x=>x.loc===S.loc);
const allLocs=()=>{const a=S.locs.slice();S.items.forEach(x=>{if(!a.includes(x.loc))a.push(x.loc)});if(!a.includes(S.loc))a.push(S.loc);return a.filter(l=>l!==''||S.items.some(x=>x.loc==='')||S.loc==='')};
let canSave=true,maybePrivate=false;
try{localStorage.setItem('inv-t','1');if(localStorage.getItem('inv-t')!=='1')canSave=false;localStorage.removeItem('inv-t')}catch(e){canSave=false}
try{navigator.storage&&navigator.storage.estimate&&navigator.storage.estimate().then(q=>{if(q&&q.quota&&q.quota<150*1024*1024){maybePrivate=true;renderHead()}}).catch(()=>{})}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));canSave=true}catch(e){canSave=false;toast('無法儲存到手機，請馬上匯出 Excel')}}
const BK=30;
function touch(){S.pend=(S.pend||0)+1;persist();renderHead()}
function exported(){S.pend=0;S.lastExp=Date.now();persist();renderHead()}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(f){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||1800;g.gain.value=.1;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.09)}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}}

function shell(){
$('#app').innerHTML=`
<div class="top"><div class="row"><div class="ttl"><h1>盤點小幫手</h1><div class="sub" id="sub"></div></div><button class="btn" id="more">更多</button></div>
<div id="warn"></div>
<button class="locbar" id="loc"><span class="lb">目前櫃位</span><b id="locn"></b><span class="ch">切換</span></button>
<div class="stats"><div><b id="n1">0</b><span>本櫃條碼種類</span></div><div><b id="n2">0</b><span>本櫃總數量</span></div></div></div>
<div class="sc" id="sc" hidden><b id="sct">掃描槍模式：直接掃描即可</b><span id="scs">每掃一次自動記錄，同一條碼數量 +1</span><div class="lastc" id="scl"></div><div class="lname" id="scn"></div></div><input id="si" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="undo" id="undo" hidden><span id="undot"></span><button id="undob">復原</button></div>
<form class="manual" id="mf"><input id="mc" placeholder="手動輸入條碼" inputmode="numeric" autocomplete="off"><button class="btn" type="submit">加入</button></form>
<div class="list" id="list"></div>
<div class="fab"><div class="in"><button class="btn" id="xls">匯出 Excel</button><button class="btn tg" id="gun">掃描槍</button><button class="btn pri big" id="scan">相機掃描</button></div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden><input type="file" id="imp" accept=".xlsx,.xls,.csv" hidden><input type="file" id="impn" accept=".xlsx,.xls,.csv" hidden>
<div class="camv" id="camv"><video id="vid" playsinline muted autoplay></video><div class="mask"><div class="win" id="win"><i></i></div></div>
<div class="camtop"><button class="cbtn" id="cx">完成</button><span id="cloc"></span><button class="cbtn" id="torch" hidden>手電筒</button></div>
<div class="campanel" id="cp"><div class="cphint" id="cph">把條碼橫放在框內，對準就會自動記錄</div><div class="cpres" id="cpr" hidden><div class="cpname" id="cpnm"></div><div class="cpcode" id="cpc"></div><div class="cpq"><button data-cq="-1">−</button><input id="cpn" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off"><button data-cq="1">+</button></div><div class="cpsub" id="cps"></div></div><div class="crow"><button class="cundo" id="cundo" hidden>復原這筆</button><button class="cnext" id="cnext" hidden>掃下一個</button></div></div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>`;
$('#warn').addEventListener('click',e=>{if(e.target.closest('[data-x]'))exportXlsx()});
$('#undob').onclick=()=>{undo();if(gun)focusGun()};
$('#imp').onchange=onImport;$('#impn').onchange=onImportNames;
$('#more').onclick=openMenu;$('#xls').onclick=exportXlsx;$('#loc').onclick=openLoc;
$('#scan').onclick=openCam;
$('#gun').onclick=()=>setGun(!gun);
$('#sc').onclick=()=>focusGun();
$('#cam').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||scanning)return;scanning=true;toast('辨識中…');const c=await decodeImage(f);scanning=false;$('#toast').classList.remove('show');if(c&&!okCode(c)){toast(isBook2(c)?'拍到書籍第二條碼（19 開頭），請拍上面那個 978 開頭的':'不是數字條碼，已略過')}else if(c){add(c);beep();toast('['+LN(S.loc)+'] '+c+' 已記錄')}else toast('看不到條碼，請再拍一次')};
const si=$('#si');
si.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();commitGun()}});
si.addEventListener('input',()=>{clearTimeout(gunT);gunT=setTimeout(commitGun,300)});
si.addEventListener('focus',()=>gunState(true));
si.addEventListener('blur',()=>gunState(false));
$('#gun').hidden=desk;
if(desk)$('#mc').placeholder='手動輸入條碼（掃描槍直接掃即可）';
$('#mf').onsubmit=e=>{e.preventDefault();const c=$('#mc').value.trim();if(!c)return;if(isBook2(c)){toast('這是書籍第二條碼（19 開頭），請輸入 978 開頭的');return}$('#mc').value='';const x=add(c);toast(c+' 數量 '+x.qty)};
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close()});
$('#list').addEventListener('click',onListClick);
$('#list').addEventListener('input',onListInput);
$('#list').addEventListener('focusin',e=>{if(e.target.dataset.act==='in')e.target.select()});
$('#cx').onclick=closeCam;
$('#torch').onclick=toggleTorch;
$('#cnext').onclick=()=>{$('#cpn').blur();armed=true;lastCode='';drawMode()};
$('#cundo').onclick=()=>{const h=undo();if(!h)return;$('#cundo').hidden=true;lastCode=h.code;lastAt=Date.now();lastAny=Date.now();const x=S.items.find(y=>y.loc===h.loc&&y.code===h.code);if(mode==='single'){armed=false;if(x){camItem=x;showCamItem(x,false)}else{camItem=null;$('#cpr').hidden=true;$('#cph').hidden=false;$('#cph').textContent='已復原，按「掃下一個」繼續'}$('#cps').textContent='已復原這筆'}else{camItem=null;$('#cpr').hidden=true;$('#cph').hidden=false}drawMode()};
$('#vid').addEventListener('click',()=>{if(!armed){armed=true;lastCode='';drawMode()}});
$('#cp').addEventListener('click',e=>{const b=e.target.closest('[data-cq]');if(!b||!camItem)return;camItem.qty=Math.max(0,rnd((camItem.qty||0)+(+b.dataset.cq)));$('#cpn').value=camItem.qty;touch();renderList();showCamItem(camItem,false)});
const cpn=$('#cpn');
let cpnSel=false;
cpn.addEventListener('focus',()=>{cpnSel=true;cpn.select();setTimeout(()=>{if(cpnSel)cpn.select()},0)});
cpn.addEventListener('beforeinput',()=>{cpnSel=false});
cpn.addEventListener('input',()=>{if(!camItem)return;const v=cpn.value.replace(/[^\d.]/g,'');if(v!==cpn.value)cpn.value=v;camItem.qty=num(v)||0;touch();renderList();$('#cps').textContent='已修改數量'});
cpn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cpn.blur()}});
cpn.addEventListener('blur',()=>{if(camItem)cpn.value=rnd(camItem.qty)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)closeCam()});
}

function renderHead(){
const h=here();
$('#n1').textContent=h.length;
$('#n2').textContent=rnd(h.reduce((a,x)=>a+(x.qty||0),0));
$('#locn').textContent=LN(S.loc);$('#loc').classList.toggle('none',!S.loc);
const nl=new Set(S.items.map(x=>x.loc)).size,tq=rnd(S.items.reduce((a,x)=>a+(x.qty||0),0));
const lh=S.hist[S.hist.length-1];
$('#undo').hidden=!lh;if(lh)$('#undot').textContent='上一筆：['+LN(lh.loc)+'] '+lh.code;

const pend=new Set(),miss=new Set();
const tfetch=(u,ms)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};
async function lookup(code){
if(S.names[code]||pend.has(code)||miss.has(code)||!/^97[89]\d{10}$/.test(code)||!navigator.onLine)return;
pend.add(code);let t='';
try{const r=await tfetch('https://api.openbd.jp/v1/get?isbn='+code,5000);const j=await r.json();const sm=j&&j[0]&&j[0].summary;if(sm&&sm.title)t=[sm.title,sm.volume].filter(Boolean).join(' ')}catch(e){}
if(!t){try{const r=await tfetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+code,5000);const j=await r.json();const v=j&&j.items&&j.items[0]&&j.items[0].volumeInfo;if(v&&v.title)t=[v.title,v.subtitle].filter(Boolean).join(' ')}catch(e){}}
pend.delete(code);
if(!t){miss.add(code);showName(code);return}
S.names[code]=t.trim();persist();renderList();showName(code);
}
function showName(code){
const t=S.names[code]||'';
if(camItem&&camItem.code===code)$('#cpnm').textContent=t||(pend.has(code)?'查詢書名中…':'');
if(gun&&$('#scl').textContent.includes(code))$('#scn').textContent=t;

}
function add(c){
let x=find(c);const isNew=!x;
if(isNew){x={code:c,loc:S.loc,qty:0};S.items.push(x)}
const pq=x.qty||0;x.qty=rnd(pq+1);x.t=Date.now();x._new=isNew;last=c;
S.hist.push({loc:S.loc,code:c,n:isNew?1:0,p:pq});if(S.hist.length>100)S.hist.shift();
touch();renderList();lookup(c);
return x;
}
function undo(){
const h=S.hist.pop();if(!h){toast('沒有可以復原的掃描');return null}
const x=S.items.find(y=>y.loc===h.loc&&y.code===h.code);
if(x){x.qty=h.p!=null?h.p:Math.max(0,rnd((x.qty||0)-1));if(h.n&&x.qty<=0)S.items=S.items.filter(y=>y!==x)}
last=null;touch();renderList();toast('已復原：['+LN(h.loc)+'] '+h.code+(h.p!=null?' 回到 '+h.p:' −1'));
return h;
}

const cv=document.createElement('canvas');
async function tick(){
if(!stream){ticking=false;return}
const v=$('#vid');
if(v.readyState>=2&&v.videoWidth){
const vw=v.videoWidth,vh=v.videoHeight;
const sw=Math.round(vw*.86),sh=Math.round(Math.min(vh*.42,sw*.6));
const sx=Math.round((vw-sw)/2),sy=Math.round((vh-sh)/2);
const k=Math.min(1,1100/sw);
cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
const g=cv.getContext('2d',{willReadFrequently:true});g.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
let code=null;
try{
if(det){const r=await det.detect(cv);const hit=(r||[]).find(x=>okCode(String(x.rawValue).trim()))||(r||[])[0];if(hit)code=hit.rawValue}
else if(zr){const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);const bm=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));code=zr.decodeWithState(bm).getText()}
}catch(e){}
if(code)onCamCode(String(code).trim());
}
setTimeout(tick,det?90:140);
}

async function decodeImage(file){
let b2=null,bmp;try{bmp=await createImageBitmap(file)}catch(e){return null}
for(const max of [1600,1000,2400]){
const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(c);const hit=(r||[]).find(x=>okCode(String(x.rawValue).trim()));if(hit)return hit.rawValue.trim();if(r&&r[0]&&!isBook2(String(r[0].rawValue).trim()))return r[0].rawValue.trim()}catch(e){}}
if(window.ZXing){try{const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);const rd=new ZXing.MultiFormatReader();rd.setHints(h);const bm=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)));const t=rd.decodeWithState(bm).getText().trim();if(!isBook2(t))return t;b2=t}catch(e){}}
}
return b2;
}

open(`<h2>匯入 Excel</h2><p class="hint">讀到 <b>${data.length}</b> 筆、${nl} 個櫃位、共 ${tq} 件。</p><div class="menu">
<button class="btn" id="im_a">加到目前資料<small>同櫃位、同條碼的數量會相加，適合合併別人的盤點</small></button>
<button class="btn" id="im_r">取代目前全部資料<small>適合還原備份、換手機後接續盤點</small></button>
<button class="btn" id="im_x">取消</button></div>`);
$('#im_x').onclick=close;
const apply=rep=>{
if(rep){S.items=[];S.hist=[];S.locs=[]}
const now=Date.now();
data.forEach(d=>{const t=S.items.find(y=>y.loc===d.loc&&y.code===d.code);if(t)t.qty=rnd((t.qty||0)+d.qty);else S.items.push({loc:d.loc,code:d.code,qty:rnd(d.qty),t:now});if(d.loc&&!S.locs.includes(d.loc))S.locs.push(d.loc)});
if(S.items.length&&!S.items.some(x=>x.loc===S.loc))S.loc=S.items[0].loc;
touch();if(rep)S.pend=0,persist();renderHead();renderList();close();toast('已匯入 '+data.length+' 筆');
};
$('#im_a').onclick=()=>apply(false);
$('#im_r').onclick=()=>{const b=$('#im_r');if(!b.dataset.c&&S.items.length){b.dataset.c=1;b.firstChild.textContent='再按一次確定取代（目前資料會被覆蓋）';return}apply(true)};
};
r.readAsArrayBuffer(f);
}

function onImportNames(e){
const f=e.target.files[0];e.target.value='';if(!f)return;
if(!window.XLSX){toast('Excel 元件載入失敗，請確認網路後重新整理');return}
const r=new FileReader();
r.onload=()=>{
let rows;
try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}catch(err){toast('讀不懂這個檔案');return}
const cell=v=>typeof v==='number'?String(Math.round(v)):String(v==null?'':v).trim();
const CK=['條碼','商品代號','國際條碼','JAN','ISBN','EAN','barcode'],NK=['品名','商品名稱','名稱','書名','商品名','品項名稱'];
const hi=rows.findIndex(r=>r.some(v=>CK.includes(cell(v)))&&r.some(v=>NK.includes(cell(v))));
let cC=0,cN=1;
if(hi>=0){const h=rows[hi].map(cell);cC=h.findIndex(v=>CK.includes(v));cN=h.findIndex(v=>NK.includes(v))}
let n=0;
rows.slice(hi+1).forEach(r=>{const c=cell(r[cC]),t=cell(r[cN]);if(okCode(c)&&t){S.names[c]=t;n++}});
if(!n){toast('找不到「條碼」和「品名」欄位');return}
persist();renderList();toast('已匯入 '+n+' 筆品名');
};
r.readAsArrayBuffer(f);
}

function openMenu(){
open(`<h2>更多</h2><div class="menu" style="margin-top:10px">
${navigator.canShare?'<button class="btn" id="m_s">分享 Excel 檔<small>直接傳到 LINE、Email、雲端硬碟</small></button>':''}
<button class="btn" id="m_i">匯入 Excel<small>還原備份、換手機接續，或合併別人的盤點</small></button>
<button class="btn" id="m_n">匯入品名對照表<small>Excel 有「條碼／商品代號」和「品名」欄位，掃到時會顯示名稱。目前已有 ${Object.keys(S.names).length} 筆</small></button>
<button class="btn" id="m_c">複製結果文字<small>櫃位、條碼、數量，可貼到 Excel 或 LINE</small></button>
<button class="btn dng" id="m_clr">清空全部，開始新的盤點</button>
<button class="btn" id="m_x">關閉</button></div>`);
$('#m_x').onclick=close;
const ms=$('#m_s');if(ms)ms.onclick=shareXlsx;
$('#m_i').onclick=()=>{close();$('#imp').click()};
$('#m_n').onclick=()=>{close();$('#impn').click()};
$('#m_c').onclick=()=>{const t='櫃號\t商品代號\t實盤量\n'+sorted().map(x=>LN(x.loc)+'\t'+x.code+'\t'+rnd(x.qty)).join('\n');
open(`<h2>結果文字</h2><textarea readonly>${esc(t)}</textarea><div class="acts"><button class="btn" id="c_x">關閉</button><button class="btn pri" id="c_c">複製</button></div>`);
$('#c_x').onclick=close;$('#c_c').onclick=async()=>{try{await navigator.clipboard.writeText(t);toast('已複製')}catch(e){toast('請長按文字框手動複製')}}};
let armed=false;$('#m_clr').onclick=()=>{if(!armed){armed=true;$('#m_clr').textContent='再按一次確定清空（無法復原）';return}S.items=[];S.locs=[];S.hist=[];S.loc='';last=null;touch();close();renderList();toast('已清空')};
}

function sorted(){const L=allLocs();return S.items.slice().sort((a,b)=>(L.indexOf(a.loc)-L.indexOf(b.loc))||((a.t||0)-(b.t||0)))}
const xesc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipBlob(files){
const enc=new TextEncoder(),parts=[],cen=[];let off=0;
files.forEach(f=>{
const nm=enc.encode(f.name),d=enc.encode(f.data),c=crc(d);
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
parts.push(new Uint8Array(h.buffer),nm,d);
const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
cen.push(new Uint8Array(e.buffer),nm);off+=30+nm.length+d.length;
});
const cs=cen.reduce((a,b)=>a+b.length,0);
const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
return new Blob(parts.concat(cen,[new Uint8Array(z.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsx(){
const ds=S.cdate||today(),wh='I01';
const [yy,mm,dd]=ds.split('-').map(Number);
const serial=(Date.UTC(yy,mm-1,dd)-Date.UTC(1899,11,30))/86400000;
const sheetName=String(mm).padStart(2,'0')+String(dd).padStart(2,'0');
const L='ABCDE';
const str=(c,r,v,st)=>'<c r="'+c+r+'" t="inlineStr"'+(st?' s="'+st+'"':'')+'><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
const n=(c,r,v,st)=>'<c r="'+c+r+'"'+(st?' s="'+st+'"':'')+'><v>'+v+'</v></c>';
let rows='<row r="1">'+['盤點日期','倉庫代號','商品代號','實盤量','櫃號'].map((h,i)=>str(L[i],1,h,1)).join('')+'</row>';
let r=2,prev=null;
sorted().forEach(x=>{
if(x.loc!==prev){
if(prev!==null){rows+='<row r="'+r+'" s="4" customFormat="1">'+[0,1,2,3,4].map(i=>'<c r="'+L[i]+r+'" s="4"/>').join('')+'</row>';r++}
rows+='<row r="'+r+'">'+n('A',r,serial,2)+str('B',r,wh)+str('C',r,x.code,3)+n('D',r,rnd(x.qty))+(x.loc?str('E',r,x.loc):'')+'</row>';prev=x.loc;
}else rows+='<row r="'+r+'">'+str('C',r,x.code,3)+n('D',r,rnd(x.qty))+'</row>';
r++;
});
const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:E'+Math.max(r-1,1)+'"/><cols><col min="1" max="1" width="13" customWidth="1"/><col min="2" max="2" width="9" customWidth="1"/><col min="3" max="3" width="21.66" customWidth="1"/><col min="4" max="4" width="13.33" customWidth="1"/><col min="5" max="5" width="9" customWidth="1"/></cols><sheetData>'+rows+'</sheetData></worksheet>';
const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy/m/d"/></numFmts><fonts count="1"><font><sz val="12"/><name val="Arial"/><family val="2"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="0" fillId="2" borderId="0" xfId="0" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
return zipBlob([
{name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
{name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
{name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+sheetName+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
{name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
{name:'xl/styles.xml',data:styles},
{name:'xl/worksheets/sheet1.xml',data:sheet}
]);
}
function ready(){if(!S.items.length){toast('還沒有任何資料');return false}return true}
function askName(btn,cb){
const def=(S.fname||'盤點')+'_'+today();
open(`<h2>匯出設定</h2><div class="f"><label class="hint">檔名（不用打 .xlsx）</label><input id="fn" value="${esc(def)}" autocomplete="off"></div>
<div class="f"><label class="hint">盤點日期</label><input id="fd" type="date" value="${esc(S.cdate||today())}"></div>
<div class="acts"><button class="btn" id="fn_x">取消</button><button class="btn pri" id="fn_ok">${btn}</button></div>`);
const inp=$('#fn');setTimeout(()=>{inp.focus();inp.select()},50);
$('#fn_x').onclick=close;
const ok=()=>{let n=inp.value.replace(/\.xlsx$/i,'').replace(/[\\/:*?"<>|\r\n]+/g,'_').trim();if(!n)n=def;
const base=n.replace(/_\d{4}-\d{2}-\d{2}$/,'');if(base)S.fname=base;S.cdate=$('#fd').value||today();persist();close();cb(n+'.xlsx')};
$('#fn_ok').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
}
function exportXlsx(){
if(!ready())return;
askName('下載',doExport);
}
function doExport(name){
const blob=buildXlsx();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);exported();toast('已匯出 Excel');
}
function shareXlsx(){
if(!ready())return;
askName('分享',doShare);
}
async function doShare(name){
const f=new File([buildXlsx()],name,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
if(!navigator.canShare||!navigator.canShare({files:[f]})){toast('這支手機不支援直接分享，請用「匯出 Excel」');return}
try{await navigator.share({files:[f],title:'盤點 '+today()});exported();close()}catch(e){}
}

shell();renderHead();renderList();
})();
</script></body></html>
